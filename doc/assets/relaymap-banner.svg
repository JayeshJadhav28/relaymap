<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">RELAYMAP — Evidence-driven project continuity</title>
  <desc id="desc">A dark graphite banner with the RELAYMAP identity and a connected path representing evidence, decisions and handover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#edeae3" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#e8b75c" stop-opacity=".4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="26" fill="url(#grid)"/>
  <path d="M890 86H1450M890 335H1450" stroke="#edeae3" stroke-opacity=".10"/>
  <path d="M960 210h85c70 0 70-93 140-93h72" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <path d="M1247 105l14 12-14 12" fill="none" stroke="#e8b75c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1045 210h0" stroke="#d9a441" stroke-width="11" stroke-linecap="round"/>
  <circle cx="960" cy="210" r="10" fill="#d9a441"/>
  <circle cx="1045" cy="210" r="6" fill="#edeae3"/>
  <circle cx="1185" cy="117" r="9" fill="#d9a441"/>
  <rect x="1265" y="82" width="170" height="70" rx="10" fill="#121214" stroke="#d9a441" stroke-opacity=".55"/>
  <text x="1350" y="110" text-anchor="middle" fill="#a8a399" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">HANDOVER</text>
  <text x="1350" y="134" text-anchor="middle" fill="#edeae3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Context retained</text>
  <path d="M960 210h85c70 0 70 93 140 93h72" fill="none" stroke="#94a9bd" stroke-opacity=".65" stroke-width="3" stroke-dasharray="6 9" stroke-linecap="round"/>
  <circle cx="1185" cy="303" r="8" fill="#94a9bd"/>
  <rect x="1265" y="268" width="170" height="70" rx="10" fill="#121214" stroke="#94a9bd" stroke-opacity=".5"/>
  <text x="1350" y="296" text-anchor="middle" fill="#a8a399" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">EVIDENCE</text>
  <text x="1350" y="320" text-anchor="middle" fill="#edeae3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Sources linked</text>
  <rect x="90" y="88" width="58" height="58" rx="13" fill="#1d1d21" stroke="#edeae3" stroke-opacity=".18"/>
  <circle cx="108" cy="122" r="5.5" fill="#d9a441"/>
  <path d="M114 122h6c7 0 7-17 14-17h3" fill="none" stroke="#d9a441" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 100l6 5-6 5" fill="none" stroke="#d9a441" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="90" y="205" fill="#edeae3" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="1">RELAYMAP</text>
  <text x="94" y="254" fill="#d9a441" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="1.2">EVIDENCE-DRIVEN PROJECT CONTINUITY</text>
  <text x="94" y="310" fill="#a8a399" font-family="Arial, Helvetica, sans-serif" font-size="24">Don't just transfer files. Transfer understanding.</text>
  <text x="94" y="365" fill="#7c776d" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2">CONNECT  /  RECONSTRUCT  /  VERIFY  /  REVIEW  /  HANDOVER</text>
</svg>