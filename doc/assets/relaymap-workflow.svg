<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="310" viewBox="0 0 1500 310" role="img" aria-labelledby="title desc">
  <title id="title">RELAYMAP five-stage workflow</title>
  <desc id="desc">Five connected stages: Connect, Reconstruct, Verify, Review and Handover.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0 0L8 4.5L0 9" fill="none" stroke="#d9a441" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1500" height="310" rx="20" fill="url(#background)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g stroke="#d9a441" stroke-opacity=".7" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <path d="M270 142H320"/>
      <path d="M555 142H605"/>
      <path d="M840 142H890"/>
      <path d="M1125 142H1175"/>
    </g>
    <g>
      <rect x="45" y="76" width="225" height="132" rx="13" fill="#121214" stroke="#d9a441" stroke-opacity=".8"/>
      <circle cx="75" cy="108" r="15" fill="#d9a441"/><text x="75" y="113" text-anchor="middle" fill="#17171a" font-size="13" font-weight="700">1</text>
      <text x="75" y="153" fill="#edeae3" font-size="24" font-weight="700">CONNECT</text>
      <text x="75" y="180" fill="#a8a399" font-size="14">Authorised sources</text>
    </g>
    <g>
      <rect x="330" y="76" width="225" height="132" rx="13" fill="#121214" stroke="#edeae3" stroke-opacity=".17"/>
      <circle cx="360" cy="108" r="15" fill="#d9a441"/><text x="360" y="113" text-anchor="middle" fill="#17171a" font-size="13" font-weight="700">2</text>
      <text x="360" y="153" fill="#edeae3" font-size="22" font-weight="700">RECONSTRUCT</text>
      <text x="360" y="180" fill="#a8a399" font-size="14">Typed candidate claims</text>
    </g>
    <g>
      <rect x="615" y="76" width="225" height="132" rx="13" fill="#121214" stroke="#edeae3" stroke-opacity=".17"/>
      <circle cx="645" cy="108" r="15" fill="#d9a441"/><text x="645" y="113" text-anchor="middle" fill="#17171a" font-size="13" font-weight="700">3</text>
      <text x="645" y="153" fill="#edeae3" font-size="24" font-weight="700">VERIFY</text>
      <text x="645" y="180" fill="#a8a399" font-size="14">Evidence and citations</text>
    </g>
    <g>
      <rect x="900" y="76" width="225" height="132" rx="13" fill="#121214" stroke="#edeae3" stroke-opacity=".17"/>
      <circle cx="930" cy="108" r="15" fill="#d9a441"/><text x="930" y="113" text-anchor="middle" fill="#17171a" font-size="13" font-weight="700">4</text>
      <text x="930" y="153" fill="#edeae3" font-size="24" font-weight="700">REVIEW</text>
      <text x="930" y="180" fill="#a8a399" font-size="14">Human decisions</text>
    </g>
    <g>
      <rect x="1185" y="76" width="270" height="132" rx="13" fill="#121214" stroke="#d9a441" stroke-opacity=".8"/>
      <circle cx="1215" cy="108" r="15" fill="#d9a441"/><text x="1215" y="113" text-anchor="middle" fill="#17171a" font-size="13" font-weight="700">5</text>
      <text x="1215" y="153" fill="#edeae3" font-size="24" font-weight="700">HANDOVER</text>
      <text x="1215" y="180" fill="#a8a399" font-size="14">Version and acknowledge</text>
    </g>
    <text x="750" y="258" text-anchor="middle" fill="#7c776d" font-size="14" letter-spacing="1.4">EVIDENCE REMAINS TRACEABLE · UNCERTAINTY REMAINS VISIBLE · PEOPLE RETAIN APPROVAL</text>
  </g>
</svg>